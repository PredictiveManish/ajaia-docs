<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ajaia Docs{% endblock %}</title>
<style>
  :root{--ink:#1a1a18;--dim:#6f6a61;--line:#e3ded6;--bg:#fbf9f6;--accent:#9c3d1e;--ok:#1f4d3f}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);background:#fff}
  header a{color:var(--ink);text-decoration:none}
  .brand{font-weight:600;letter-spacing:-.01em}
  main{max-width:860px;margin:0 auto;padding:28px 22px 80px}
  h1{font-size:22px;margin:0 0 6px}
  .muted{color:var(--dim);font-size:13px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .card a{color:var(--accent);text-decoration:none;font-weight:500}
  button,.btn{font:inherit;padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  input[type=text],input[type=password],input[type=file],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:#fff}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .err{background:#f9eaea;border:1px solid #e6c9c9;color:#8c2f2f;padding:10px 12px;border-radius:5px;margin-bottom:14px;font-size:14px}
  .tag{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);border:1px solid var(--line);padding:2px 7px;border-radius:20px}
  section{margin-top:32px}
  section h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 10px}
  .empty{color:var(--dim);font-size:14px;padding:10px 0}
  .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  button.big{font-size:15px;padding:11px 20px}
  a.card.link{text-decoration:none;color:var(--ink);transition:border-color .12s}
  a.card.link:hover{border-color:#c9c2b6}
  .card .title{font-weight:500;color:var(--accent);margin-bottom:2px}
  .import{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-top:18px}
  .import summary{cursor:pointer;font-size:14px;color:var(--dim)}
  .dl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55;
      padding:1px 8px;white-space:pre-wrap;word-break:break-word}
  .dl.add{background:#eaf5ec;color:#1f4d3f}
  .dl.del{background:#fbe9e9;color:#8c2f2f}
  .dl.hunk{background:#f4f1ec;color:var(--dim)}
  .dl.ctx{color:var(--dim)}
  .diffbox{border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:8px;background:#fff}
  .ver{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:10px}
  .ver .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <a class="brand" href="/documents">Ajaia Docs</a>
  <div class="row">
    {% if user is defined and user %}
      <span class="muted">{{ user['display_name'] }}</span>
      <a class="muted" href="/logout">Sign out</a>
    {% endif %}
  </div>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
