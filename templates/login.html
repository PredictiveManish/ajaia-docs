{% extends "base.html" %}
{% block title %}Sign in - Ajaia Docs{% endblock %}
{% block body %}
<h1>Sign in</h1>
<p class="muted">Demo accounts are seeded. Password for all three is <code>demo123</code>.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/login" style="max-width:340px;margin-top:20px">
  <div class="row" style="flex-direction:column;align-items:stretch">
    <label class="muted">Username</label>
    <input type="text" name="username" placeholder="manish / priya / alex" required autofocus>
    <label class="muted" style="margin-top:10px">Password</label>
    <input type="password" name="password" placeholder="demo123" required>
    <button class="primary" type="submit" style="margin-top:16px">Sign in</button>
  </div>
</form>
{% endblock %}
